name: Build HAMMER-SGS image
on:
  workflow_dispatch:
  push:
    # scripts/ is left out on purpose: the Slurm job runs scripts from the cloned repo, not the image
    paths:
      - 'HAMMER-sgs/Dockerfile'
      - 'HAMMER-sgs/.dockerignore'
      - 'HAMMER-sgs/requirements.txt'
      - '.github/workflows/hammer-sgs-cbuild.yml' # Self-trigger

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kutayeroglu/hammer-sgs
  VERSION: latest

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Delete huge unnecessary tools folder
        run: rm -rf /opt/hostedtoolcache

      # - name: Maximize build disk space
      #   uses: easimon/maximize-build-space@v10
      #   with:
      #     root-reserve-mb: 256
      #     swap-size-mb: 4096
      #     remove-dotnet: 'true'
      #     remove-android: 'true'
      #     remove-haskell: 'true'
      #     remove-codeql: 'true'
      #     remove-docker-images: 'true'

      - name: Check disk space
        run: df -h

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: HAMMER-sgs
          # The commit-SHA tag records which build a Slurm job pulled
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          push: true
          # The ~8 GB image would crowd out the 10 GB GHA cache, so caching stays off
          # cache-from: type=gha
          # cache-to: type=gha,mode=max
